name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      should_release: ${{ steps.check_tag.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read root package version
        id: get_version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "podlogs" and .manifest_path == "'"$GITHUB_WORKSPACE"'/Cargo.toml") | .version')
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"
      - name: Check if tag exists
        id: check_tag
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          if git rev-parse "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag v$VERSION does not exist, will create release"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - name: Show pinned toolchain
        run: rustup show
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libvulkan1 libxkbcommon-dev libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libssl-dev pkg-config
      - name: Test
        run: cargo test --locked

  build-macos:
    needs: [check-version, test]
    if: needs.check-version.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: aarch64
            runner: macos-15
          - target: x86_64-apple-darwin
            arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}
      - name: Show pinned toolchain
        run: rustup show
      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked
      - name: Build DMG
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: |
          cargo build --release --locked --target ${{ matrix.target }}
          cargo packager --release --target ${{ matrix.target }} --formats dmg
      - name: Rename and verify DMG
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          DMG_FILE=$(find target -type f -name '*.dmg' -print -quit)
          test -n "$DMG_FILE"
          mv "$DMG_FILE" "$(dirname "$DMG_FILE")/PodLogs_${VERSION}_macos_${ARCH}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: target/**/PodLogs_*_macos_*.dmg
          if-no-files-found: error

  build-linux:
    needs: [check-version, test]
    if: needs.check-version.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - name: Show pinned toolchain
        run: rustup show
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libvulkan1 libxkbcommon-dev libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libssl-dev pkg-config patchelf libfuse2
      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked
      - name: Build DEB and AppImage
        run: |
          cargo build --release --locked
          cargo packager --release --formats deb,appimage
      - name: Rename and verify packages
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          DEB_FILE=$(find target -type f -name '*.deb' -print -quit)
          APPIMAGE_FILE=$(find target -type f -name '*.AppImage' -print -quit)
          test -n "$DEB_FILE"
          test -n "$APPIMAGE_FILE"
          mv "$DEB_FILE" "$(dirname "$DEB_FILE")/PodLogs_${VERSION}_linux_${ARCH}.deb"
          mv "$APPIMAGE_FILE" "$(dirname "$APPIMAGE_FILE")/PodLogs_${VERSION}_linux_${ARCH}.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            target/**/PodLogs_*_linux_${{ matrix.arch }}.deb
            target/**/PodLogs_*_linux_${{ matrix.arch }}.AppImage
          if-no-files-found: error

  build-windows:
    needs: [check-version, test]
    if: needs.check-version.outputs.should_release == 'true'
    continue-on-error: true
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - name: Show pinned toolchain
        run: rustup show
      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked
      - name: Build NSIS installer
        run: |
          cargo build --release --locked
          cargo packager --release --formats nsis
      - name: Rename and verify installer
        shell: pwsh
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          $file = Get-ChildItem target/release -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $file) { throw 'NSIS installer was not produced' }
          Rename-Item $file.FullName "PodLogs_${env:VERSION}_windows_x64-setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: target/**/PodLogs_*_windows_x64-setup.exe
          if-no-files-found: error

  release:
    needs: [check-version, build-macos, build-linux, build-windows]
    if: always() && github.ref == 'refs/heads/main' && needs.check-version.outputs.should_release == 'true' && needs.build-macos.result == 'success' && needs.build-linux.result == 'success'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download successful artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' -o -name '*windows_x64-setup.exe' \) -exec cp {} release/ \;
          test -n "$(find release -type f -name '*.dmg' -print -quit)"
          test "$(find release -type f -name '*.dmg' | wc -l)" -eq 2
          test "$(find release -type f -name '*.deb' | wc -l)" -eq 2
          test "$(find release -type f -name '*.AppImage' | wc -l)" -eq 2
          ls -la release
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: PodLogs v${{ needs.check-version.outputs.version }}
          body: |
            ## PodLogs v${{ needs.check-version.outputs.version }}

            A modern Kubernetes pod log viewer desktop application.

            ### Downloads

            macOS: Apple Silicon and Intel DMG installers (macOS 12.0 Monterey or newer).
            Linux: Debian and AppImage packages for amd64 and arm64. Linux has not been manually tested.
            Windows: x64 NSIS installer when available. Windows has not been manually tested; this installer is unsigned and Windows SmartScreen may show a warning.

            ### Installation

            macOS builds are unsigned and not notarized. On first launch, right-click PodLogs and select Open to bypass Gatekeeper.

            ### Requirements
            - A valid `~/.kube/config` file with cluster access
            - Network connectivity to your Kubernetes clusters
          draft: false
          prerelease: false
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
