[package]
name = "podlogs"
version = "2.0.0"
description = "Kubernetes Pod Log Viewer"
authors = ["PodLogs"]
edition = "2024"

[package.metadata.packager]
product-name = "PodLogs"
identifier = "dev.podlogs.pass"
icons = ["icons/icon.png", "icons/icon.icns", "icons/icon.ico"]
resources = ["assets/fonts/OFL-JetBrainsMono.txt", "assets/fonts/OFL-IBMPlexSans.txt"]

[package.metadata.packager.macos]
minimum-system-version = "12.0"

[dependencies]
gpui-kit = "=0.9.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
kube = { version = "0.98", features = ["client", "config", "runtime"] }
k8s-openapi = { version = "0.24", features = ["v1_32"] }
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
dirs = "5"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2.7" # already in the tree via gpui's macOS backend

[dev-dependencies]
http = "1"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["test-util"] }
gpui-kit = { version = "=0.9.1", features = ["test-support"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
